<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<style>
  body{font-family:'Segoe UI',Roboto,system-ui,sans-serif;background:#f7f5f3;color:#232323;
       display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center;}
  .card{background:#fff;border:1px solid #ece7e2;border-radius:12px;padding:32px 40px;max-width:420px;}
  h1{font-size:20px;margin:0 0 8px;}
  p{color:#7a7570;font-size:14px;margin:0;}
</style>
</head>
<body>
  <div class="card">
    <h1>{{ title }}</h1>
    <p>{{ topic }}</p>
    <p>Живой квиз проводится с экрана урока — открывается отдельно у преподавателя.</p>
  </div>
</body>
</html>
