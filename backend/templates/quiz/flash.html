<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Academy — {{ title }}</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  /* Стиль слайдшоу уроков Log Academy (claude/lesson-html-slideshow-pipeline.md):
     сцена 1920×1080 масштабируется под экран, кремовый фон, карточки с
     тёмной обводкой и «жёсткой» тенью, Baloo 2 / Quicksand / Kalam. */
  :root{
    --blue:#2F8FE0; --yellow:#FFC145; --pink:#FF6B8B; --green:#43B36B;
    --purple:#8B6AE8; --orange:#FF8A3D; --cream:#FFF8EC; --card:#FFFDF6;
    --card-alt:#FFF3DC; --dark:#2B2118; --muted:#6B5F52;
    --head:'Baloo 2','Trebuchet MS',sans-serif;
    --body:'Quicksand','Trebuchet MS',sans-serif;
    --hand:'Kalam','Comic Sans MS','Trebuchet MS',sans-serif;
  }
  html,body{margin:0;padding:0;background:#111;overflow:hidden;height:100%;width:100%}
  *{box-sizing:border-box}
  #stage{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left}
  .screen{position:absolute;inset:0;overflow:hidden;display:none;flex-direction:column;
    padding:110px 128px 150px;gap:36px;background:var(--cream);color:var(--dark);font-family:var(--body)}
  .screen.active{display:flex}

  #progress{position:fixed;top:0;left:0;height:8px;width:0;background:var(--orange);z-index:1000;transition:width .3s ease}
  #fsBtn{position:fixed;top:14px;right:14px;z-index:1000;background:var(--dark);color:var(--cream);border:none;
    border-radius:50px;padding:8px 18px;font:700 15px var(--body);cursor:pointer;opacity:.75}
  #fsBtn:hover{opacity:1;background:var(--green)}

  .kicker{display:inline-flex;align-self:flex-start;padding:14px 30px;border-radius:50px;border:5px solid var(--dark);
    font:700 26px/1 var(--head);letter-spacing:1.5px;text-transform:uppercase}
  .card{background:var(--card);padding:48px 56px;border-radius:36px;border:5px solid var(--dark);box-shadow:12px 12px 0 var(--dark)}
  .btn{background:var(--dark);color:var(--cream);border:5px solid var(--dark);border-radius:50px;padding:16px 38px;
    font:700 28px var(--body);cursor:pointer;transition:transform .1s, background .2s}
  .btn:hover{background:var(--green)}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.35;cursor:default}
  
  .btn--light{background:var(--card);color:var(--dark)}
  .btn--light:hover{background:var(--yellow)}
  .btn--big{font-size:40px;padding:22px 64px;box-shadow:10px 10px 0 var(--dark)}
  .nav-row{display:flex;gap:20px;justify-content:center;margin-top:auto}
  .mini-logo{position:absolute;right:80px;bottom:48px;width:44px;height:44px}

  /* Титул */
  #screen-title{background:var(--orange);color:var(--cream);justify-content:center}
  #screen-title .logo{position:absolute;left:96px;top:80px;width:300px;height:90px}
  #screen-title h1{font:800 110px/1.05 var(--head);margin:0}
  #screen-title .topic{font:700 52px/1.2 var(--head);margin:0;color:var(--dark)}
  #screen-title .count{background:var(--yellow);color:var(--dark)}

  /* Вопрос */
  .q-head{display:flex;justify-content:space-between;align-items:center}
  .q-num{background:var(--blue);color:var(--cream)}
  .timer{position:relative;width:170px;height:170px;flex-shrink:0}
  .timer svg{transform:rotate(-90deg);width:170px;height:170px}
  .timer-bg{fill:var(--card);stroke:var(--dark);stroke-width:5}
  .timer-arc{fill:none;stroke:var(--green);stroke-width:9;stroke-linecap:round;stroke-dasharray:226.19;stroke-dashoffset:0;
    transition:stroke-dashoffset 1s linear, stroke .4s}
  .timer-arc.urgent{stroke:var(--pink)}
  .timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 64px var(--head);color:var(--dark)}
  .timer-num.urgent{color:var(--pink)}
  .q-category{display:inline-block;background:var(--yellow);border:4px solid var(--dark);border-radius:50px;padding:8px 24px;
    font:700 24px var(--head);text-transform:uppercase;letter-spacing:1px;margin-bottom:28px}
  .q-text{font:800 68px/1.2 var(--head);margin:0}

  /* Время вышло */
  #screen-blank{background:var(--dark);color:var(--cream);justify-content:center;align-items:center;text-align:center;cursor:pointer}
  #screen-blank .big-label{font:800 130px/1.1 var(--head)}
  #screen-blank .tap-hint{font:700 44px var(--hand);color:var(--yellow);animation:pulse 1.8s ease-in-out infinite}
  #screen-blank .nav-row{margin-top:60px}
  #screen-blank .btn{background:transparent;border-color:var(--cream)}
  #screen-blank .btn:hover{background:var(--green);border-color:var(--green)}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

  /* Ответ */
  .a-label{background:var(--green);color:var(--cream)}
  .a-question{font:600 34px/1.45 var(--body);color:var(--muted);font-style:italic;margin:0}
  .a-card{background:var(--dark);color:var(--cream);box-shadow:12px 12px 0 var(--yellow)}
  .a-text{font:800 72px/1.2 var(--head);margin:0}

  /* Финал */
  #screen-finish{background:var(--green);color:var(--cream);justify-content:center;align-items:center;text-align:center}
  #screen-finish h2{font:800 150px/1 var(--head);margin:0}
  #screen-finish p{font:700 50px var(--hand);margin:0;color:var(--dark)}
  .btn:disabled:hover{background:var(--dark)}
  .btn--light:disabled:hover{background:var(--card)}
</style>
</head>
<body>
<div id="progress"></div>
<button id="fsBtn" onclick="toggleFullscreen()">&#9974; Во весь экран</button>
<div id="stage">

  <section class="screen active" id="screen-title">
    <img class="logo" src="/assets/logo.svg" alt="Log Academy">
    <span class="kicker count">{{ questions_count }} вопросов</span>
    <h1>{{ title }}</h1>
    <p class="topic">{{ topic }}</p>
    <div><button class="btn btn--light btn--big" onclick="startQuiz()">Начать викторину</button></div>
  </section>

  <section class="screen" id="screen-question">
    <div class="q-head">
      <span class="kicker q-num" id="q-num">Вопрос 1 / {{ questions_count }}</span>
      <div class="timer">
        <svg viewBox="0 0 80 80"><circle class="timer-bg" cx="40" cy="40" r="36"/><circle class="timer-arc" id="timer-arc" cx="40" cy="40" r="36"/></svg>
        <div class="timer-num" id="timer-num">60</div>
      </div>
    </div>
    <div class="card">
      <div class="q-category">{{ topic }}</div>
      <p class="q-text" id="q-text"></p>
    </div>
    <div class="nav-row">
      <button class="btn btn--light" id="btn-prev" onclick="prevQuestion()">← Назад</button>
      <button class="btn" id="btn-close" onclick="skipToBlank()">Закрыть вопрос ⏩</button>
    </div>
    <div class="mini-logo"><svg viewBox="34.14 18.74 226.0 226.0" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><path fill="#eb5230" d="m 90.644216,19.242044 v 28 28 h -28 -28 v 84.500006 84.5 h 84.499994 84.49999 v -28 -28 h 28 28 v -84.5 -84.500006 h -84.5 z m 108.499984,55.94531 2.25977,0.54883 2.25781,0.54687 -0.25781,55.730476 -0.25977,55.72852 -55.77734,0.25781 -55.777332,0.25781 -0.482421,-1.25781 -0.482422,-1.25781 0.259765,-55 0.259766,-55.000006 53.999984,-0.27735 z"/></svg></div>
  </section>

  <section class="screen" id="screen-blank">
    <div class="big-label">⏱ Время вышло!</div>
    <div class="tap-hint">Нажми куда угодно, чтобы увидеть ответ</div>
    <div class="nav-row">
      <button class="btn" onclick="prevQuestion()">← Назад</button>
      <button class="btn" id="btn-show" onclick="showAnswer()">Показать ответ →</button>
    </div>
  </section>

  <section class="screen" id="screen-answer">
    <span class="kicker a-label">✓ Правильный ответ</span>
    <p class="a-question" id="a-question-text"></p>
    <div class="card a-card"><p class="a-text" id="a-text"></p></div>
    <div class="nav-row">
      <button class="btn btn--light" onclick="prevQuestion()">← Назад</button>
      <button class="btn" id="btn-next" onclick="nextQuestion()">Следующий вопрос →</button>
    </div>
    <div class="mini-logo"><svg viewBox="34.14 18.74 226.0 226.0" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><path fill="#eb5230" d="m 90.644216,19.242044 v 28 28 h -28 -28 v 84.500006 84.5 h 84.499994 84.49999 v -28 -28 h 28 28 v -84.5 -84.500006 h -84.5 z m 108.499984,55.94531 2.25977,0.54883 2.25781,0.54687 -0.25781,55.730476 -0.25977,55.72852 -55.77734,0.25781 -55.777332,0.25781 -0.482421,-1.25781 -0.482422,-1.25781 0.259765,-55 0.259766,-55.000006 53.999984,-0.27735 z"/></svg></div>
  </section>

  <section class="screen" id="screen-finish">
    <h2>Молодец! 🎉</h2>
    <p>Все вопросы пройдены!</p>
    <div style="margin-top:40px"><button class="btn btn--light btn--big" onclick="startQuiz()">Начать заново</button></div>
  </section>
</div>

<script>
  const QUESTIONS = {{ questions_json }};
  const CIRCUMFERENCE = 2 * Math.PI * 36;

  let currentIndex = 0;
  let timerInterval = null;
  let timeLeft = 60;
  let totalTime = 60;

  // Сцена 1920×1080 вписывается в окно (как в слайдшоу уроков)
  function resize() {
    const stage = document.getElementById('stage');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    const x = (window.innerWidth - 1920 * s) / 2;
    const y = (window.innerHeight - 1080 * s) / 2;
    stage.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
  }
  window.addEventListener('resize', resize);
  resize();

  function toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }

  function setProgress(done) {
    document.getElementById('progress').style.width = (done / QUESTIONS.length * 100) + '%';
  }

  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function startQuiz() {
    currentIndex = 0;
    showQuestion();
  }

  function showQuestion() {
    clearInterval(timerInterval);
    if (currentIndex >= QUESTIONS.length) {
      setProgress(QUESTIONS.length);
      show('screen-finish');
      return;
    }
    const q = QUESTIONS[currentIndex];
    totalTime = q.time || 60;
    timeLeft = totalTime;
    document.getElementById('q-num').textContent = `Вопрос ${currentIndex + 1} / ${QUESTIONS.length}`;
    document.getElementById('q-text').textContent = q.question;
    document.getElementById('btn-prev').disabled = currentIndex === 0;
    setProgress(currentIndex);
    show('screen-question');
    startTimer();
  }

  function startTimer() {
    updateTimerDisplay();
    timerInterval = setInterval(() => {
      timeLeft--;
      updateTimerDisplay();
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        show('screen-blank');
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    const numEl = document.getElementById('timer-num');
    const arc = document.getElementById('timer-arc');
    numEl.textContent = timeLeft;
    const progress = totalTime > 0 ? (1 - timeLeft / totalTime) : 0;
    arc.style.strokeDashoffset = CIRCUMFERENCE * progress;
    const urgent = timeLeft <= 10;
    arc.classList.toggle('urgent', urgent);
    numEl.classList.toggle('urgent', urgent);
  }

  function skipToBlank() {
    clearInterval(timerInterval);
    show('screen-blank');
  }

  function showAnswer() {
    clearInterval(timerInterval);
    const q = QUESTIONS[currentIndex];
    document.getElementById('a-question-text').textContent = q.question;
    document.getElementById('a-text').textContent = q.answer;
    setProgress(currentIndex + 1);
    document.getElementById('btn-next').textContent =
      currentIndex >= QUESTIONS.length - 1 ? 'Завершить →' : 'Следующий вопрос →';
    show('screen-answer');
  }

  function nextQuestion() {
    currentIndex++;
    showQuestion();
  }

  function prevQuestion() {
    if (currentIndex > 0) currentIndex--;
    showQuestion();
  }

  document.getElementById('screen-blank').addEventListener('click', function (e) {
    if (e.target.tagName !== 'BUTTON') showAnswer();
  });

  // Пробел / Enter / → — вперёд, ← — назад (удобно с пультом-кликером)
  document.addEventListener('keydown', function (e) {
    const active = document.querySelector('.screen.active');
    if (!active) return;
    const forward = e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight' || e.key === 'PageDown';
    const backward = e.key === 'ArrowLeft' || e.key === 'PageUp';
    if (forward) {
      e.preventDefault();
      if (active.id === 'screen-title' || active.id === 'screen-finish') startQuiz();
      else if (active.id === 'screen-question') skipToBlank();
      else if (active.id === 'screen-blank') showAnswer();
      else if (active.id === 'screen-answer') nextQuestion();
    } else if (backward) {
      e.preventDefault();
      prevQuestion();
    }
  });
</script>
</body>
</html>
