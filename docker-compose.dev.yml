services:
  db:
    image: postgres:15
    container_name: logacademy_dev_db
    restart: unless-stopped
    env_file:
      - .env.dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: logacademy_dev_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env.dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_dev_data:/data

  backend:
    build: ./backend
    container_name: logacademy_dev_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.dev
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:8000
    container_name: logacademy_dev_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.dev
    depends_on:
      - backend

volumes:
  postgres_dev_data:
  minio_dev_data:
