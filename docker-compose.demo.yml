version: '3.8'
services:
  db:
    image: postgres:15
    container_name: logacademy_demo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: logacademy_demo_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_demo_data:/data

  backend:
    build: ./backend
    container_name: logacademy_demo_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.demo
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: logacademy_demo_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}

volumes:
  postgres_demo_data:
  minio_demo_data:
