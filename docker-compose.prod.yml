version: '3.8'
services:
  backend:
    build: ./backend
    container_name: logacademy_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    container_name: logacademy_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}
