services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./translations:/app/translations
      - ./frontend/src:/app/frontend/src:ro
      - ./.env.prod:/app/.env

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://192.168.0.9/api
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend