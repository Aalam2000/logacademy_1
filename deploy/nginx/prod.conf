# Реверс-прокси теперь сам в докер-сети compose-проекта — обращается к
# backend/frontend по внутренним именам сервисов, без публикации их
# портов на хост (не получилось через loopback-бинд, см. историю —
# для frontend-контейнера 127.0.0.1 не работает в принципе).

# Лимит на перебор пароля на /auth/login (см. location ниже) — зона в http-
# контексте (conf.d/*.conf у nginx:alpine инклюдится именно в http {}).
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name logacademy 192.168.0.9 quiz.logacademy.online;
    client_max_body_size 50m;

    # Не светим точную версию nginx в заголовке Server и на страницах ошибок.
    server_tokens off;

    # Базовые security-заголовки — на server{}, чтобы работали и для
    # фронтенда, и для API. CSP пока в Report-Only: браузер ничего не
    # блокирует, только пишет в консоль/отчёты, что бы он заблокировал —
    # проверяем на живом сайте перед тем как включать всерьёз.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'self';" always;

    # Рейт-лимит на попытки логина — отдельный exact-match location,
    # перекрывает общий /api/ только для этого пути.
    location = /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        # Отдельный лог этого location — его читает fail2ban на хосте
        # (см. docker-compose.prod.yml: /var/log/nginx-fail2ban смонтирован
        # с хоста). Основной access_log (в docker logs) это не отменяет —
        # они пишутся параллельно.
        access_log /var/log/nginx-fail2ban/login.log combined;
        proxy_pass http://backend:8000/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # POST /i18n/languages — внутренний метод библиотеки (добавление
    # целевого языка + перевод реестра через OpenAI), наружу не нужен и
    # не должен быть достижим снаружи платформы. Разрешаем снаружи только
    # GET (используется анонимными посетителями на странице логина и т.п.),
    # остальные методы (POST и т.д.) режем прямо на nginx, до бэкенда.
    location = /i18n/languages {
        limit_except GET {
            deny all;
        }
        proxy_pass http://backend:8000/i18n/languages;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /i18n/ {
        proxy_pass http://backend:8000/i18n/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
