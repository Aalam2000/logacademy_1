# Реверс-прокси теперь сам в докер-сети compose-проекта — обращается к
# backend/frontend по внутренним именам сервисов, без публикации их
# портов на хост (не получилось через loopback-бинд, см. историю —
# для frontend-контейнера 127.0.0.1 не работает в принципе).
server {
    listen 80;
    server_name logacademy 192.168.0.9;
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /i18n/ {
        proxy_pass http://backend:8000/i18n/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
