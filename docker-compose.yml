version: '3.8'
services:
  db:
    image: postgres:15
    container_name: logacademy_db
    environment:
      POSTGRES_USER: logacademy
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: logacademy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logacademy"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: logacademy_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./translations:/app/translations
      - ./frontend/src:/app/frontend_src

  frontend:
    build: ./frontend
    container_name: logacademy_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - REACT_APP_API_URL=http://localhost:8000

volumes:
  postgres_data: