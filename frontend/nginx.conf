server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-роутинг: неизвестный путь отдаём index.html, React Router
    # разбирается сам (раньше это делал сам serve с флагом -s).
    location / {
        try_files $uri /index.html;
    }

    # ES-модули (.mjs) — например, обработчик pdf.js для просмотра
    # презентаций. Стандартный mime.types nginx их не знает и отдаёт как
    # application/octet-stream, а браузер такой модуль не запускает.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }
}
